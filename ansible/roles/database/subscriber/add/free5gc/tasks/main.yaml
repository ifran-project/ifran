# Role to add a subscriber to Free5GC database (mongodb)

# Input:
# - ue_name: str
# - ue_config: UEConfiguration
# - database_ip: IPvAnyAddress

# Output: None
---
- name: Add UE '{{ ue_name }}' to Free5GC 'subscriptionData.authenticationData.authenticationSubscription' collection
  community.mongodb.mongodb_shell:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_database: admin
    db: free5gc
    eval: |
      db.getCollection("subscriptionData.authenticationData.authenticationSubscription").updateOne(
        { "ueId": "imsi-{{ ue_config.supi }}" },
        {
          "$set": {
            "ueId": "imsi-{{ ue_config.supi }}",
            "authenticationMethod": "{{ ue_config.authenticationData.authenticationMethod }}",
            "encPermanentKey": "{{ ue_config.authenticationData.k }}",
            "encOpcKey": "{{ ue_config.authenticationData.opc }}",
            "authenticationManagementField": "{{ ue_config.authenticationData.amf }}",
            "sequenceNumber": {
              "sqn": "{{ ue_config.authenticationData.sqn | lower }}",
              "sqnScheme": "GENERAL",
            }
          }
        },
        { "upsert": true }
      )

- name: Add UE '{{ ue_name }}' to Free5GC 'subscriptionData.authenticationData.webAuthenticationSubscription' collection
  community.mongodb.mongodb_shell:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_database: admin
    db: free5gc
    eval: |
      db.getCollection("subscriptionData.authenticationData.webAuthenticationSubscription").updateOne(
        { "ueId": "imsi-{{ ue_config.supi }}" },
        {
          "$set": {
            "ueId": "imsi-{{ ue_config.supi }}",
            "authenticationMethod": "{{ ue_config.authenticationData.authenticationMethod }}",
            "authenticationManagementField": "{{ ue_config.authenticationData.amf }}",
            "sequenceNumber": "{{ ue_config.authenticationData.sqn | lower }}",
            "permanentKey": {
              "permanentKeyValue": "{{ ue_config.authenticationData.k }}",
              "encryptionKey": 0,
              "encryptionAlgorithm": 0,
            },
            "opc": {
              "opcValue": "{{ ue_config.authenticationData.opc }}",
              "encryptionKey": 0,
              "encryptionAlgorithm": 0,
            },
            "milenage": {
              "op": {
                "opValue": "{{ ue_config.authenticationData.op }}",
                "encryptionKey": 0,
                "encryptionAlgorithm": 0,
              },
            },
          }
        },
        { "upsert": true }
      )

- name: Add UE '{{ ue_name }}' to Free5GC 'policyData.ues.amData' collection
  community.mongodb.mongodb_shell:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_database: admin
    db: free5gc
    eval: |
      db.getCollection("policyData.ues.amData").updateOne(
        { "ueId": "imsi-{{ ue_config.supi }}" },
        {
          "$set": {
            "ueId": "imsi-{{ ue_config.supi }}",
            "subscCats": [ "free5gc" ],
          }
        },
        { "upsert": true }
      )

- name: Add UE '{{ ue_name }}' to Free5GC 'policyData.ues.smData' collection
  community.mongodb.mongodb_shell:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_database: admin
    db: free5gc
    eval: |
      db.getCollection("policyData.ues.smData").updateOne(
        { "ueId": "imsi-{{ ue_config.supi }}" },
        {
          "$set": {
            "ueId": "imsi-{{ ue_config.supi }}",
            "smPolicySnssaiData": {
            {% for subscription in ue_config.subscriptions %}
              {% set snssai = '%02d' | format(subscription.snssai.sst) ~ subscription.snssai.sd if subscription.snssai.sd else '%02d' | format(subscription.snssai.sst) %}
              "{{ snssai }}": {
                "snssai": {
                  "sst": {{ subscription.snssai.sst }},
                {% if subscription.snssai.sd %}
                  "sd": "{{ subscription.snssai.sd }}",
                {% endif %}
                },
                "smPolicyDnnData": { "{{ subscription.dnn.name }}": { "dnn": "{{ subscription.dnn.name }}" } }
              },
            {% endfor %}
            }
          }
        },
        { "upsert": true }
      )

- name: Add UE '{{ ue_name }}' entries for each gNB
  ansible.builtin.include_tasks: for_gnb.yaml
  loop: "{{ ue_config.gnbs }}"
  loop_control:
    loop_var: gnb_item
    label: "GNB: {{ gnb_item }}"
