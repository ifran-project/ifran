# Role to remove a subscriber from Open5GS dataabse (mongodb)

# Reference: https://github.com/open5gs/open5gs/blob/d261bd43d859ec3d9c9f95a441dc295ce0814a7b/webui/server/models/subscriber.js

# Input:
# - ue_name: str
# - ue_config: UEConfiguration
# - database_ip: IPvAnyAddress

# Output: None
---
- name: Remove UE '{{ ue_name }}' from Open5GS database
  community.mongodb.mongodb_shell:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_database: admin
    db: open5gs
    eval: |
      db.subscribers.deleteOne({
        "imsi": "{{ ue_config.supi }}"
      })
