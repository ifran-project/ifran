# Kubernetes wait role

# Wait until the Kubernetes system pods (kube-system and calico-system) have been created and report a 'Ready' status.

# Input: None
# Output: None
---
- name: Wait for 'calico-system' namespace to be created by the Tigera operator
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: calico-system
    wait: yes
    wait_sleep: 10
    wait_timeout: 3600 # 1h of waiting before timeout

- name: Wait for pods to be populated in system namespaces
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ item }}"
  loop:
    - kube-system
    - calico-system
  register: ns_pods
  until: ns_pods.resources | length > 0
  retries: 100
  delay: 5

# A pod listed when the wait starts can be deleted and recreated meanwhile (e.g. by the Tigera operator or a
# DaemonSet rollout at cluster start): the wait then fails instead of following the new pod, so it is retried
# with a new list of pods.
- name: Wait for all system pods to become ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ item }}"
    field_selectors:
      - status.phase!=Succeeded
    wait: yes
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 3600 # 1h of waiting before timeout
    wait_sleep: 10
  register: system_pods
  until: system_pods is succeeded
  retries: 3
  delay: 5
  loop:
    - kube-system
    - calico-system
