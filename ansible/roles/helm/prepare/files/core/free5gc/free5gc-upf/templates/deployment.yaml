apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}
    {{- include "free5gc-upf.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "free5gc-upf.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- include "free5gc-upf.selectorLabels" . | nindent 8 }}
    {{- if or .Values.staticPodIp (and .Values.multus.enabled .Values.multus.interfaces) }}
      annotations:

        {{- if .Values.staticPodIp }}
        cni.projectcalico.org/ipAddrs: '["{{ .Values.staticPodIp }}"]'
        {{- end }}

        {{- if and .Values.multus.enabled .Values.multus.interfaces }}
        k8s.v1.cni.cncf.io/networks: |-
          [
          {{- $first := true }}
          {{- range .Values.multus.interfaces }}
          {{- if .enabled }}
            {{- if not $first }},{{- end }}
            {
              "name": "{{ $.Release.Name }}-{{ .name }}",
              "interface": "{{ .name }}"
              {{- if .mac }},
              "mac": "{{ .mac }}"
              {{- end }}
              {{- if .defaultRoute }},
              "default-route": ["{{ .defaultRoute }}"]
              {{- end }}
              {{- if .gateway }},
              "gateway": "{{ .gateway }}"
              {{- end }}
            }
            {{- $first = false }}
          {{- end }}
          {{- end }}
          ]
        {{- end }}
    {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.imagePullSecrets | indent 8 }}
    {{- end }}
      initContainers:
      - name: install-gtp5g
        image: debian:13-slim
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
          - /bin/bash
          - -c
          - |
            set -e

            KVER="$(uname -r)"

            # Use the pod's working DNS configuration inside the host chroot.
            mount --bind /etc/resolv.conf /host/etc/resolv.conf

            chroot /host /bin/bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                gcc \
                g++ \
                make \
                libmnl-dev \
                kmod \
                linux-headers-${KVER}

              git clone \
                --depth 1 \
                --branch v0.10.2 \
                https://github.com/free5gc/gtp5g.git \
                /tmp/gtp5g
              
              cd /tmp/gtp5g
              make
              make install
            "
        volumeMounts:
          - name: host-root
            mountPath: /host
      - name: init-upf
        image: debian:13-slim
        imagePullPolicy: IfNotPresent
        command:
          - /free5gc/config/entrypoint.sh
        volumeMounts:
          - mountPath: /free5gc/config
            name: configuration
        resources:
          requests:
            memory: 1Mi
            cpu: 1m
        securityContext:
            privileged: true
      containers:
    {{- if .Values.includeTcpDumpContainer }}
      - name: tcpdump
        image: "{{ .Values.tcpdumpimage.repository }}:{{ .Values.tcpdumpimage.version }}"
        imagePullPolicy: {{ .Values.tcpdumpimage.pullPolicy }}
        {{- if .Values.resources.define}}
        resources:
          requests:
            memory: {{ .Values.resources.requests.tcpdump.memory | quote }}
            cpu: {{ .Values.resources.requests.tcpdump.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.tcpdump.memory | quote }}
            cpu: {{ .Values.resources.limits.tcpdump.cpu | quote }}
        {{- end}}
        securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if .Values.start.tcpdump}}
        command:
          - /bin/sh
          - -c
          - /usr/bin/tcpdump -i any -w /tmp/pcap/{{ .Chart.Name }}_`date +%Y-%m-%d_%H_%M-%S-%Z`.pcap
        {{- else}}
        command:
          - /bin/sleep
          - infinity
        {{- end}}
        {{- if .Values.includeTcpDumpContainer}}
        {{- if .Values.persistent.sharedvolume}}
        volumeMounts:
        - mountPath: "/tmp/pcap"
          name: cn5g-pvc
        {{- end}}
        {{- end}}
    {{- end }}
      - name: upf
        image: "{{ .Values.nfimage.repository }}:{{ .Values.nfimage.version }}"
        imagePullPolicy: {{ .Values.nfimage.pullPolicy }}
        volumeMounts:
          - mountPath: /free5gc/config
            name: configuration
        securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if .Values.resources.define}}
        resources:
          requests:
            memory: {{ .Values.resources.requests.nf.memory | quote }}
            cpu: {{ .Values.resources.requests.nf.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.nf.memory | quote }}
            cpu: {{ .Values.resources.limits.nf.cpu | quote }}
        {{- end}}
        {{- if .Values.readinessProbe}}
        readinessProbe:
          exec:
              command:
              - /bin/sh
              - -c
              - "ss -lun | grep -q ':{{ .Values.config.listening_port }} '"
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        {{- end}}
        {{- if .Values.livenessProbe}}
        livenessProbe:
          exec:
              command:
              - /bin/sh
              - -c
              - "ss -lun | grep -q ':{{ .Values.config.listening_port }} '"
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        {{- end}}
        ports:
        {{- range $name, $port := .Values.exposedPorts }}
        - containerPort: {{ $port.port }}
          name: {{ $name }}
          {{- if $port.protocol }}
          protocol: {{ $port.protocol }}
          {{- end }}
        {{- end }}
        {{- if .Values.start.upf}}
        command:
          - /free5gc/upf
        args:
          - -c
          - /free5gc/config/config.yaml
        {{- else}}
        command:
          - /bin/sleep
          - infinity
        {{- end}}
      volumes:
      {{- if .Values.includeTcpDumpContainer}}
      {{- if .Values.persistent.sharedvolume}}
      - name: cn5g-pvc
        persistentVolumeClaim:
          claimName: cn5g-pvc
      {{- end }}
      {{- end }}
      - name: configuration
        configMap:
        {{- if .Values.global }}
          name: {{ .Values.global.coreNetworkConfigMap }}
        {{- else }}
          name: {{ .Chart.Name }}-configmap
          items:
            - key: config.yaml
              path: config.yaml
            - key: entrypoint.sh
              path: entrypoint.sh
              mode: 0777
        {{- end }}
      - name: host-root
        hostPath:
          path: /
          type: Directory
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: {{ .Chart.Name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
         {{- toYaml .Values.nodeSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 12 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 12 }}
      {{- end }}
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
