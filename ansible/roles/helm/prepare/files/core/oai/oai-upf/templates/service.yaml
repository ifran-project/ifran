apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}
    {{- include "oai-upf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.global }}{{ if not .Values.global.clusterIpServiceIpAllocation }}
  clusterIP: None
  {{- end }}{{ end }}
  ports:
    {{- range $name, $port := .Values.exposedPorts }}
    - name: {{ $name }}
      port: {{ $port.port }}
      targetPort: {{ $port.port }}
      {{- if $port.protocol }}
      protocol: {{ $port.protocol }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "oai-upf.selectorLabels" . | nindent 4 }}