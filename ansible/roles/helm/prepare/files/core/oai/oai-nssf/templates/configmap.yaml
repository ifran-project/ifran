{{- if not .Values.global }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-configmap
  labels:
    app: {{ .Release.Name }}
data:
  {{ (.Files.Glob "config.yaml").AsConfig | indent 2 | trim }}
  nssf_slice_config.yaml: |
{{ .Values.nssf_slice_config | nindent 4 }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-configmap
  labels:
    app: {{ .Release.Name }}
data:
  nssf_slice_config.yaml: |
{{ .Values.nssf_slice_config | nindent 4 }}
{{- end }}
