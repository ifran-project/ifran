apiVersion: v1
kind: Service
metadata:
  name: service-{{ .Release.Namespace }}-appmgr-http
  labels:
    {{- include "osc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "osc.selectorLabels" . | nindent 4 }}
