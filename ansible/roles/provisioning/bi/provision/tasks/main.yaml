# BI provisioner provision role.

# Assumes the deployment machine (host on which this Ansible code will run) has
# the 'slices' and 'slices-bi' CLIs installed and authenticated with the user's SLICES account.

# Input:
# - resource_name: str
# - project: str
# - infra: str
# - experiment: str
# - image: str
# - flavor: str
# - create_experiment: bool
# - experiment_duration: str

# Output:
# - ssh_info: SSHInfo
---
- name: Select project '{{ project }}' for '{{ resource_name }}' provisioning
  # use shell instead of command here to avoid cli error
  ansible.builtin.shell: slices project use {{ project }}

- name: Delete experiment with name '{{ experiment }}' if it exists before attempting create for '{{ resource_name }}'
  ansible.builtin.command: slices experiment delete {{ experiment }} --force
  register: delete_result
  ignore_errors: true
  when: create_experiment

- name: Wait for experiment deletion to take effect for '{{ resource_name }}'
  ansible.builtin.pause:
    seconds: 5
  when:
    - create_experiment
    - delete_result is defined
    - delete_result.rc == 0

- name: Try to create experiment '{{ experiment }}' for '{{ resource_name }}'
  ansible.builtin.command: slices experiment create {{ experiment }} --duration {{ experiment_duration }}
  ignore_errors: true
  when: create_experiment

- name: Define SLICES_BI_INFRA and SLICES_EXPERIMENT environment variables for '{{ resource_name }}'
  ansible.builtin.set_fact:
    bi_env:
      SLICES_BI_INFRA: "{{ infra }}"
      SLICES_EXPERIMENT: "{{ experiment }}"

- name: Create '{{ resource_name }}' on infrastructure '{{ infra }}' using experiment '{{ experiment }}'
  ansible.builtin.command: slices bi create {{ resource_name }} --image "{{ image }}" --flavor "{{ flavor }}" --duration {{ node_duration }} --wait
  environment: "{{ bi_env }}"

- name: Get '{{ resource_name }}' information
  ansible.builtin.command: slices bi show {{ resource_name }} --format json
  register: node_info
  changed_when: false
  environment: "{{ bi_env }}"

- name: Remove ANSI codes from BI node output for '{{ resource_name }}'
  ansible.builtin.set_fact:
    node_json: "{{ node_info.stdout | regex_replace('\x1b\\[[0-9;]*m', '') }}"

- name: Parse JSON outputs for '{{ resource_name }}'
  ansible.builtin.set_fact:
    bi_node: "{{ (node_json | from_json) }}"

- name: Return updated SSH info object for '{{ resource_name }}'
  ansible.builtin.set_stats:
    data:
      ssh_info:
        hostname: "{{ bi_node.ssh_logins[0].host }}"
        port: "{{ bi_node.ssh_logins[0].port }}"
        user: "{{ bi_node.ssh_logins[0].username }}"
        jumphost: >-
          {{
            {
              "hostname": bi_node.ssh_logins[0].jump_proxy.host,
              "port": bi_node.ssh_logins[0].jump_proxy.port,
              "user": bi_node.ssh_logins[0].jump_proxy.username
            }
            if (bi_node.ssh_logins[0].jump_proxy | default(none, true)) is not none
            else none
          }}
