# Unified radio managememt API provisioner UE connect role.

# Input:
# - ue_name: str
# - ue: UE
# - token: str | None
# - token_params: UnifiedRadioTokenParams | None

# Output: None
---
- name: Get access token if missing
  ansible.builtin.include_role:
    name: provisioning/unified_radio/get_token
    public: true # share role vars for next tasks (token)

- name: Initialize '{{ ue_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/ue/{{ ue_name }}/initialize"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    body_format: json
    body:
      nr_bands: "{{ ue.config.nrBands }}"
      contexts: >-
        [
          {% for pdu_session in ue_config.pduSessions %}
            {% set subscription = ue_config.subscriptions[pdu_session.subscriptionIndex] %}
            {
              "ssc": "{{ pdu_session.sscMode }}",
              "dnn": {{ subscription.dnn.name }},
              "pdu_session_type": "{{ subscription.dnn.pduSessionType }}",
              "s_nssai": {
                "sst": {{ subscription.snssai.sst }},
                "sd": 0x{{ subscription.snssai.sd }},
              },
            },
          {% endfor %}
        ]
    status_code: 200

- name: Turn radio on for '{{ ue_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/ue/{{ ue_name }}/radio/on"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    status_code: 200

- name: Connect '{{ ue_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/ue/{{ ue_name }}/connect"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    body_format: json
    body: >-
      [
        {% for pdu_session in ue_config.pduSessions %}
          {% set subscription = ue_config.subscriptions[pdu_session.subscriptionIndex] %}
          {
            "ssc": "{{ pdu_session.sscMode }}",
            "dnn": {{ subscription.dnn.name }},
            "pdu_session_type": "{{ subscription.dnn.pduSessionType }}",
            "s_nssai": {
              "sst": {{ subscription.snssai.sst }},
              "sd": 0x{{ subscription.snssai.sd }},
            },
          },
        {% endfor %}
      ]
    status_code: 200
