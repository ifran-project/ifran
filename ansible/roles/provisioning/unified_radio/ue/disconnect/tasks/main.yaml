# Unified radio managememt API provisioner UE disconnect role.

# Input:
# - ue_name: str
# - ue: UE
# - token: str | None
# - token_params: UnifiedRadioTokenParams | None

# Output: None
---
- name: Get access token if missing
  ansible.builtin.include_role:
    name: provisioning/unified_radio/get_token
    public: true # share role vars for next tasks (token)

- name: Build UE context for '{{ ue_name }}'
  ansible.builtin.include_role:
    name: provisioning/unified_radio/ue/build_context
    public: true # share role vars for next tasks (ue_contexts)

- name: Disconnect '{{ ue_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/ue/{{ ue_name }}/disconnect"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    body_format: json
    body: "{{ ue_contexts }}"
    timeout: 300 # disconnect takes some time
  loop: "{{ ue.config.pduSessions }}"
  loop_control:
    loop_var: pdu_session
    label: "{{ subscription.dnn.name }}"
