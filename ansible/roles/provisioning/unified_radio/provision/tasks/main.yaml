# Unified radio managememt API provisioner provision role.

# Input:
# - resource_name: str
# - base_url: URL
# - token: str | None
# - token_params: UnifiedRadioTokenParams | None
# - is_ru: bool

# Output: 
# - if is_ru: ru_ips: list[str]
# - else: ssh_info: SSHInfo
---
- name: Get access token if missing
  ansible.builtin.include_role:
    name: provisioning/unified_radio/get_token
    public: true # share role vars for next tasks (token)

- name: Power on '{{ resource_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/power/{{ resource_name }}/power_on"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    status_code: 200
    timeout: 300 # power on takes some time

- name: Wait for '{{ resource_name }}' to be ready (responds to ping)
  ansible.builtin.uri:
    url: "{{ base_url }}/resource/{{ resource_name }}/ready"
    method: GET
    headers:
      Authorization: "Bearer {{ generated_token }}"
    status_code: 200
  register: readiness_check
  until: readiness_check.status == 200
  retries: 100
  delay: 5

- name: Get resource info for '{{ resource_name }}'
  ansible.builtin.uri:
    url: "{{ base_url }}/resource/{{ resource_name }}"
    method: GET
    status_code: 200
  register: resource_info_resp
  when: is_ru

- name: Return IP list for '{{ resource_name }}' if it's an RU
  ansible.builtin.set_stats:
    data:
      ru_ips: "{{ resource_info_resp.json.misc.ips }}"
  when: is_ru

- name: Return empty SSH info object for '{{ resource_name }}'
  ansible.builtin.set_stats:
    data:
      ssh_info: {} # can't construct ssh_info
  when: not is_ru
