# R2Lab provisioner reserve role.

# Input:
# - base_url: URL
# - token: str | None
# - r2lab_slice: str
# - reservation_params: R2LabReservationParams
# - reservation_period: int
# - start_time: datetime
# - end_time: datetime

# Output: None
---
- name: Fetch R2Lab access token if missing
  ansible.builtin.uri:
    url: "{{ reservation_params.r2lab_api_url }}/auth/login"
    method: POST
    body_format: json
    body:
      email: "{{ reservation_params.email }}"
      password: "{{ reservation_params.password }}"
    status_code: 200
  register: token_response
  when: not token

- name: Get R2Lab access token if it was fetched
  ansible.builtin.set_fact:
    generated_token: "{{ token if token else token_response.json.access_token }}"

- name: Create R2Lab lease for '{{ reservation_period }}' minutes
  ansible.builtin.uri:
    url: "{{ reservation_params.r2lab_api_url }}/leases"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    body_format: json
    body:
      resource_id: 1 # r2lab
      slice_name: "{{ r2lab_slice }}"
      # floor timestamps to R2Lab's 10 minute granularity (error: Lease times must be aligned to 600s granularity)
      t_from: >-
        {{
          (start_time | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).replace(
            minute=((start_time | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).minute // 10) * 10,
            second=0,
            microsecond=0
          ).strftime('%Y-%m-%dT%H:%M:%S%z')
        }}
      t_until: >-
        {{
          (end_time | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).replace(
            minute=((end_time | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).minute // 10) * 10,
            second=0,
            microsecond=0
          ).strftime('%Y-%m-%dT%H:%M:%S%z')
        }}
    status_code: 201

- name: Get access token if missing for R2lab
  ansible.builtin.include_role:
    name: provisioning/unified_radio/get_token
    public: true # share role vars for next tasks (token)

- name: Turn all off on R2lab
  ansible.builtin.uri:
    url: "{{ base_url }}/power/r2lab-all/power_off"
    method: POST
    headers:
      Authorization: "Bearer {{ generated_token }}"
    status_code: 200
    timeout: 300 # r2lab all-off takes a long time to execute, tolerate up to 5 minutes timeout
