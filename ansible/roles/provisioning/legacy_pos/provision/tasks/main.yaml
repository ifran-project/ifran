# Legacy POS provisioner provision role.

# Input:
# - resource_name: str
# - reservation_period: int (if attempt_reservation is True)
# - image: str (if only_bootstrap is False)
# - is_staged_image: bool
# - only_bootstrap: bool
# - boot_params: str | None
# - central_pos_ssh_info: SSHInfo
# - public_key_files: list[str]

# Output:
# - ssh_info: SSHInfo
---
- name: Register central POS host for '{{ resource_name }}'
  ansible.builtin.add_host:
    name: central_pos
    ansible_connection: ssh
    ansible_host: "{{ central_pos_ssh_info.hostname }}"
    ansible_user: "{{ central_pos_ssh_info.user }}"
    ansible_port: "{{ central_pos_ssh_info.port }}"
    ansible_ssh_common_args: "{{ central_pos_ssh_info.common_args | default(omit, true) }}"

- block:
  - name: Free any existing allocation for '{{ resource_name }}'
    ansible.builtin.command: pos allocations free {{ resource_name }} --keep-calendar-event

  - name: Allocate '{{ resource_name }}'
    ansible.builtin.command: pos allocations allocate {{ resource_name }}

  - name: Set image for '{{ resource_name }}'
    ansible.builtin.command: pos nodes image {{ resource_name }} {{ image }} {{ "--staging" if is_staged_image else "" }}
    when: not only_bootstrap

  - name: Set boot parameters for '{{ resource_name }}'
    ansible.builtin.command: pos nodes bootparameter {{ resource_name }} --raw {{ boot_params }}
    when:
      - not only_bootstrap
      - boot_params is not none

  - name: Reset '{{ resource_name }}'
    ansible.builtin.command: pos nodes reset {{ resource_name }}
    when: not only_bootstrap

  - name: Bootstrap '{{ resource_name }}'
    ansible.builtin.command: pos nodes bootstrap {{ resource_name }}
    when: only_bootstrap

  - name: Read SSH public keys from localhost for '{{ resource_name }}'
    ansible.builtin.slurp:
      src: "{{ item }}"
    loop: "{{ public_key_files }}"
    register: public_key_contents
    delegate_to: localhost

  - name: Render SSH public keys installation script for '{{ resource_name }}'
    ansible.builtin.template:
      src: add_pubkeys.sh.j2
      dest: "/tmp/add_pubkeys_{{ resource_name }}_{{ central_pos_ssh_info.user }}.sh"
      mode: "777" # leave the file open so that everyone can delete it if left hanging for some reason
    vars:
      public_keys: "{{ public_key_contents.results | map(attribute='content') | map('b64decode') | join('\n') }}"

  - name: Install SSH public keys on '{{ resource_name }}'
    ansible.builtin.command: pos commands launch {{ resource_name }} --infile /tmp/add_pubkeys_{{ resource_name }}_{{ central_pos_ssh_info.user }}.sh

  - name: Remove local temporary SSH public keys installation script for '{{ resource_name }}'
    ansible.builtin.file:
      path: "/tmp/add_pubkeys_{{ resource_name }}_{{ central_pos_ssh_info.user }}.sh"
      state: absent

  - name: Return updated SSH info object for '{{ resource_name }}'
    ansible.builtin.set_stats:
      data:
        ssh_info:
          hostname: "{{ resource_name }}"
          port: 22
          user: "root"
          jumphost: >-
            {{
              {
                "hostname": central_pos_ssh_info.hostname,
                "port": central_pos_ssh_info.port,
                "user": central_pos_ssh_info.user
              }
            }}

  delegate_to: central_pos
