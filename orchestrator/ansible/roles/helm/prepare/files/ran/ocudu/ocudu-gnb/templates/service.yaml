apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}
    {{- include "ocudu-gnb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    {{- range $name, $port := .Values.exposedPorts }}
    - name: {{ $name }}
      port: {{ $port.port }}
      targetPort: {{ $port.port }}
      {{- if $port.protocol }}
      protocol: {{ $port.protocol }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "ocudu-gnb.selectorLabels" . | nindent 4 }}
