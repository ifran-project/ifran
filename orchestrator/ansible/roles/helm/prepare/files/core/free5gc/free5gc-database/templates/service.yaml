apiVersion: v1
kind: Service
metadata:
  name: {{ include "free5gc-mongodb.name" . }}
  labels:
    {{- include "free5gc-mongodb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    {{- include "free5gc-mongodb.labels" . | nindent 4 }}
