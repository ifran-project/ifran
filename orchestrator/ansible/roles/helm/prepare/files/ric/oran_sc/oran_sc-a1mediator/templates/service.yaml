apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "osc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 10000, targetPort: http, protocol: TCP}
    - {name: rmrroute, port: 4561, targetPort: rmrroute, protocol: TCP}
    - {name: rmrdata, port: 4562, targetPort: rmrdata, protocol: TCP}
  selector:
    {{- include "osc.selectorLabels" . | nindent 4 }}
