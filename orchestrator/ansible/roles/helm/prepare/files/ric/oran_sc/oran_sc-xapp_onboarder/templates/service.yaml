apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "oran-sc-xapp-onboarder.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oran-sc-xapp-onboarder.selectorLabels" . | nindent 4 }}
