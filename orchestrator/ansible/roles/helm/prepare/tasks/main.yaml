# Role to prepare/render Helm chart on Kubernetes cluster

# Assumes that {{ component.category }}/{{ component.implementation }}/{{ component.implementation }}-{{ component.type }} exists in files and in templates
# e.g. core/oai/oai-amf

# Input:
# - component_name: str
# - component: K8S5GComponent
# - chart_name: str
# - helm_build_dir: str
# - rendered_files: list[str]

# Output: None
---
- name: Create Helm build directory for '{{ chart_name }}' chart
  ansible.builtin.file:
    path: "{{ helm_build_dir }}"
    state: directory
    mode: "0700"

- name: Copy local '{{ component.implementation }}-{{ component.type }}' Helm chart directory for '{{ chart_name }}'
  ansible.builtin.copy:
    src: "{{ component.category }}/{{ component.implementation }}/{{ component.implementation }}-{{ component.type }}/"
    dest: "{{ helm_build_dir }}"
    mode: "0755"

- name: Render '{{ chart_name }}' Helm Chart.yaml file from Jinja template
  ansible.builtin.template:
    src: "Chart.yaml.j2"
    dest: "{{ helm_build_dir }}/Chart.yaml"
    mode: "0600"

- name: Render templated Helm files for '{{ chart_name }}'
  ansible.builtin.template:
    src: "{{ component.category }}/{{ component.implementation }}/{{ component.implementation }}-{{ component.type }}/{{ item }}.j2"
    dest: "{{ helm_build_dir }}/{{ item }}"
    mode: "0600"
  loop: "{{ rendered_files }}"
