# Role to install Helm chart on Kubernetes cluster

# Input:
# - component: K8S5GComponent
# - chart_name: str
# - helm_build_dir: str
# - output_with_multus: bool

# Output:
# - network_info: str if output_with_multus is False, else list[MultusNetworkStatus]
---
- name: Check for official chart overrides
  ansible.builtin.stat:
    path: "{{ helm_build_dir }}/orchestrator-values.yaml"
  register: official_values

- name: Ensure official O-RAN SC namespaces exist
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    state: present
  loop:
    - "{{ component.namespace }}"
    - ricxapp
    - ricinfra
  when: official_values.stat.exists

# Namespace migration needs more than deleting the previous platform
# namespace. OSC charts also create objects in ricxapp and cluster-scoped RBAC
# objects; those survive namespace deletion and retain their old Helm owner.
# Remove every object owned by this exact release in another namespace before
# installing the release in ricplt. Objects owned by other releases, and all
# objects already owned by the current release namespace, are untouched.
- name: Migrate stale Helm ownership for '{{ chart_name }}'
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail

      release={{ chart_name | quote }}
      target_namespace={{ component.namespace | quote }}

      while IFS=$'\t' read -r old_release old_namespace; do
        [ -n "$old_release" ] || continue
        [ "$old_namespace" != "$target_namespace" ] || continue
        echo "Removing previous Helm release $old_release from $old_namespace"
        helm uninstall "$old_release" -n "$old_namespace" --wait
      done < <(
        helm list --all-namespaces --output json |
          jq -r --arg release "$release" \
            '.[] | select(.name == $release) | [.name, .namespace] | @tsv'
      )

      namespaced_resources="configmaps,secrets,serviceaccounts,services,roles.rbac.authorization.k8s.io,rolebindings.rbac.authorization.k8s.io,deployments.apps,statefulsets.apps,persistentvolumeclaims,ingresses.networking.k8s.io"
      while IFS=$'\t' read -r object_kind object_namespace object_name; do
        [ -n "$object_name" ] || continue
        echo "Removing stale $object_kind/$object_name from $object_namespace"
        kubectl delete "$object_kind" "$object_name" \
          -n "$object_namespace" --wait=true
      done < <(
        kubectl get "$namespaced_resources" --all-namespaces -o json |
          jq -r --arg release "$release" --arg target "$target_namespace" '
            .items[] |
            select(.metadata.annotations["meta.helm.sh/release-name"] == $release) |
            select(.metadata.annotations["meta.helm.sh/release-namespace"] != $target) |
            [.kind, .metadata.namespace, .metadata.name] | @tsv
          '
      )

      cluster_resources="clusterroles.rbac.authorization.k8s.io,clusterrolebindings.rbac.authorization.k8s.io,persistentvolumes"
      while IFS=$'\t' read -r object_kind object_name; do
        [ -n "$object_name" ] || continue
        echo "Removing stale $object_kind/$object_name"
        kubectl delete "$object_kind" "$object_name" --wait=true
      done < <(
        kubectl get "$cluster_resources" -o json |
          jq -r --arg release "$release" --arg target "$target_namespace" '
            .items[] |
            select(.metadata.annotations["meta.helm.sh/release-name"] == $release) |
            select(.metadata.annotations["meta.helm.sh/release-namespace"] != $target) |
            [.kind, .metadata.name] | @tsv
          '
      )
    executable: /bin/bash
  register: helm_namespace_migration
  changed_when: "'Removing ' in helm_namespace_migration.stdout"
  when:
    - component.category == 'ric'
    - component.implementation == 'oran_sc'
    - component.namespace == 'ricplt'

- name: Deploy rendered '{{ chart_name }}' Helm chart in namespace '{{ component.namespace }}'
  kubernetes.core.helm:
    name: "{{ chart_name }}"
    chart_ref: "{{ helm_build_dir }}"
    release_namespace: "{{ component.namespace }}"
    create_namespace: true
    state: present
    values_files:
      - "{{ helm_build_dir }}/{{ 'orchestrator-values.yaml' if official_values.stat.exists else 'values.yaml' }}"

- name: Wait for '{{ chart_name }}' pod to become ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ component.namespace }}"
    label_selectors:
      - >-
        {{ 'app=' ~ component.namespace ~ '-' ~ component.type ~ ('-alpha' if component.type == 'e2term' else '')
           if official_values.stat.exists
           else 'app.kubernetes.io/name=' ~ chart_name }}
    wait: true
    wait_condition:
      type: Ready
    wait_timeout: 200
    wait_sleep: 1
  register: pod_info

- name: Read '{{ chart_name }}' RIC service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: "{{ component.namespace }}"
    name: >-
      {{ ('service-' ~ component.namespace ~ '-e2term-sctp-alpha')
         if official_values.stat.exists and component.type == 'e2term'
         else ('service-' ~ component.namespace ~ '-dbaas-tcp')
         if official_values.stat.exists and component.type == 'dbaas'
         else ('service-' ~ component.namespace ~ '-' ~ component.type ~ '-http')
         if official_values.stat.exists
         else chart_name }}
  register: service_info
  when:
    - not output_with_multus
    - component.category == 'ric'

- name: Collect assigned '{{ chart_name }}' pod IP addresses
  ansible.builtin.set_fact:
    assigned_pod_ips: >-
      {{ pod_info.resources
         | selectattr('status.podIP', 'defined')
         | map(attribute='status.podIP')
         | reject('equalto', none)
         | reject('equalto', '')
         | list }}
  when: not output_with_multus

- name: Set '{{ chart_name }}' network information
  ansible.builtin.set_fact:
    # RIC endpoints normally use a stable Service IP. Headless Services expose
    # clusterIP=None, so report an actually assigned Pod IP instead. There can
    # temporarily be both terminating and ready pods during a clean redeploy;
    # never assume resources[0] has an address.
    network_info: >-
      {{ service_info.resources[0].spec.clusterIP
         if component.category == 'ric'
            and service_info.resources[0].spec.clusterIP not in [none, '', 'None']
         else assigned_pod_ips | first }}
  when: not output_with_multus

- name: Set '{{ chart_name }}' Multus network information if Multus was used
  ansible.builtin.set_fact:
    network_info: "{{ pod_info.resources[0].metadata.annotations['k8s.v1.cni.cncf.io/network-status'] | default('[]') | from_json }}"
  when: output_with_multus

- name: Validate '{{ chart_name }}' network information
  ansible.builtin.assert:
    that:
      - network_info is defined
      - network_info is not none
      - network_info | string | length > 0
      - network_info | string != 'None'
    fail_msg: >-
      No usable Service or ready Pod IP was discovered for {{ chart_name }}
      in namespace {{ component.namespace }}.

- name: Return '{{ chart_name }}' network information
  ansible.builtin.set_stats:
    data:
      network_info: "{{ network_info }}"
