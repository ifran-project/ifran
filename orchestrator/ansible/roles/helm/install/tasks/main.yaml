# Generic Helm installation and network discovery.
---
- name: Deploy '{{ chart_name }}' Helm chart
  kubernetes.core.helm:
    name: "{{ chart_name }}"
    chart_ref: "{{ helm_build_dir }}"
    release_namespace: "{{ component.namespace }}"
    create_namespace: true
    state: present
    values_files:
      - "{{ helm_build_dir }}/values.yaml"

- name: Wait for '{{ chart_name }}' pod to become ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ component.namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ chart_name }}"
    wait: true
    wait_condition:
      type: Ready
    wait_timeout: 200
    wait_sleep: 1
  register: pod_info

- name: Collect assigned '{{ chart_name }}' pod IP addresses
  ansible.builtin.set_fact:
    assigned_pod_ips: >-
      {{ pod_info.resources
         | selectattr('status.podIP', 'defined')
         | map(attribute='status.podIP')
         | reject('equalto', none)
         | reject('equalto', '')
         | list }}
  when: not output_with_multus

- name: Set '{{ chart_name }}' pod network information
  ansible.builtin.set_fact:
    network_info: "{{ assigned_pod_ips | first | default('') }}"
  when: not output_with_multus

- name: Set '{{ chart_name }}' Multus network information
  ansible.builtin.set_fact:
    network_info: "{{ pod_info.resources[0].metadata.annotations['k8s.v1.cni.cncf.io/network-status'] | default('[]') | from_json }}"
  when: output_with_multus

- name: Return '{{ chart_name }}' network information
  ansible.builtin.set_stats:
    data:
      network_info: "{{ network_info }}"
