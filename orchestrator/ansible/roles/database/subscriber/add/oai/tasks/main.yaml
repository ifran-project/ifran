# Role to add a subscriber to OAI dataabse (mysql)

# Input:
# - ue_name: str
# - ue_config: UEConfiguration
# - database_ip: IPvAnyAddress

# Output: None
---
- name: Add UE '{{ ue_name }}' to OAI 'AuthenticationSubscription' table
  community.mysql.mysql_query:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_db: oai_db
    query: |
      INSERT IGNORE INTO AuthenticationSubscription (
        ueid,
        authenticationMethod,
        encPermanentKey,
        protectionParameterId,
        sequenceNumber,
        authenticationManagementField,
        algorithmId,
        encOpcKey,
        encTopcKey,
        vectorGenerationInHss,
        n5gcAuthMethod,
        rgAuthenticationInd,
        supi
      )
      VALUES (
        '{{ ue_config.supi }}',
        '{{ ue_config.authenticationData.authenticationMethod | upper }}',
        '{{ ue_config.authenticationData.k }}',
        '{{ ue_config.authenticationData.k }}',
        '{{ {"sqn": ue_config.authenticationData.sqn, "sqnScheme": "NON_TIME_BASED", "lastIndexes": {"ausf": 0}} | to_json }}',
        '{{ ue_config.authenticationData.amf }}',
        'milenage',
        '{{ ue_config.authenticationData.opc }}',
        NULL,
        NULL,
        NULL,
        NULL,
        '{{ ue_config.supi }}'
      );

- name: Add UE '{{ ue_name }}' to OAI 'SessionManagementSubscriptionData' table
  community.mysql.mysql_query:
    login_host: "{{ database_ip }}"
    login_user: test
    login_password: test
    login_db: oai_db
    query: |
      INSERT IGNORE INTO SessionManagementSubscriptionData (
        ueid,
        servingPlmnid,
        singleNssai,
        dnnConfigurations
      )
      VALUES (
        {% set subscription = ue_config.subscriptions[item.1.subscriptionIndex] %}
        '{{ ue_config.supi }}',
        '{{ item.0.plmnId.plmnId }}',
        '{{ {
          "sst": subscription.snssai.sst,
          "sd": subscription.snssai.sd if subscription.snssai.sd else "FFFFFF"
        } | to_json }}',
        '{{ {
          subscription.dnn.name: {
            "pduSessionTypes": {
              "defaultSessionType": subscription.dnn.pduSessionType | upper
            },
            "sscModes": {
              "defaultSscMode": "{{ item.1.sscMode | upper }}",
            },
            "5gQosProfile": {
              "5qi": subscription.dnn.qosFlows[0].fiveQI,
              "arp": {
                "priorityLevel": subscription.dnn.qosFlows[0].arp.priorityLevel,
                "preemptCap": subscription.dnn.qosFlows[0].arp.preemptionCapability | upper,
                "preemptVuln": subscription.dnn.qosFlows[0].arp.preemptionVulnerability | upper
              },
              "priorityLevel": subscription.dnn.qosFlows[0].arp.priorityLevel
            } if subscription.dnn.qosFlows else {},
            "sessionAmbr": {
              "uplink": item.1.sessionAmbr.uplink ~ "bps",
              "downlink": item.1.sessionAmbr.downlink ~ "bps"
            } if item.1.sessionAmbr else {
              "uplink": subscription.dnn.aggregateMaximumBitRate.uplink ~ "bps",
              "downlink": subscription.dnn.aggregateMaximumBitRate.downlink ~ "bps"
            },
            "staticIpAddress": (
              [
                {
                  "ipv4Addr": item.1.ueIPv4Address
                }
              ] if item.1.ueIPv4Address else []
              ) + (
              [
                {
                  "ipv6Addr": item.1.ueIPv6Address
                }
              ] if item.1.ueIPv6Address else []
            )
          }
        } | to_json }}'
      );
  loop: "{{ ue_config.gnb[1].config.plmnList | product(ue_config.pduSessions) | list }}"
  loop_control:
    label: "PLMN ID: {{ item.0.plmnId.plmnId }}, Session Index: {{ item.1.subscriptionIndex }}"
