---
- name: Audit xApp platform and functional integration
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail

      deployment="ricxapp-{{ xapp_name }}"
      kubectl rollout status -n {{ xapp_namespace }} \
        deployment/"$deployment" --timeout=120s

      audit_pod="ric-xapp-audit-$RANDOM"
      cleanup() {
        kubectl delete pod -n {{ ric_namespace }} "$audit_pod" \
          --ignore-not-found --wait=false >/dev/null 2>&1 || true
      }
      trap cleanup EXIT
      kubectl run "$audit_pod" -n {{ ric_namespace }} --restart=Never \
        --image=curlimages/curl --command -- sleep 360
      kubectl wait -n {{ ric_namespace }} --for=condition=Ready \
        "pod/$audit_pod" --timeout=60s

      appmgr_result="$(kubectl exec -n {{ ric_namespace }} "$audit_pod" -- \
        curl --max-time 10 --fail --silent \
          http://{{ appmgr_service }}:8080/ric/v1/xapps)"
      printf '%s\n' "$appmgr_result" | \
        jq -e '.[] | select(.name == "{{ xapp_name }}" and .status == "deployed")'

      node_result="$(kubectl exec -n {{ ric_namespace }} "$audit_pod" -- \
        curl --max-time 10 --fail --silent \
          http://{{ e2mgr_service }}:3800/v1/nodeb/states)"
      printf '%s\n' "$node_result" | \
        jq -e '.[] | select(.connectionStatus == "CONNECTED")'

      rtmgr_pod="$(kubectl get endpoints -n {{ ric_namespace }} \
        {{ rtmgr_service }} \
        -o jsonpath='{.subsets[0].addresses[0].targetRef.name}')"
      test -n "$rtmgr_pod"
      kubectl logs -n {{ ric_namespace }} pod/"$rtmgr_pod" | \
        grep "Update Routes to Endpoint: service-ricxapp-{{ xapp_name }}-rmr.{{ xapp_namespace }}:4560 successful" | tail -1

      if [ {{ indication_timeout }} -eq 0 ]; then
        echo "Platform audit passed; indication wait was disabled."
        exit 0
      fi

      for _ in $(seq 1 $(({{ indication_timeout }} / 5 + 1))); do
        xapp_logs="$(kubectl logs -n {{ xapp_namespace }} deployment/"$deployment" --since=10m 2>&1)"
        # Do not use grep -q here. With pipefail and a large log buffer, grep's
        # early exit closes the pipe and printf returns SIGPIPE (141), turning a
        # successful match into a false negative.
        if grep -iE 'Received indication|indication message from' \
          <<<"$xapp_logs" >/dev/null; then
          printf '%s\n' "$xapp_logs" | grep -iE 'Received indication|indication message from' | tail -10
          echo "Functional audit passed: the xApp received an E2 indication."
          exit 0
        fi
        if grep -iE 'subscription failed|No supported action definition|Traceback|segmentation fault' \
          <<<"$xapp_logs" >/dev/null; then
          printf '%s\n' "$xapp_logs" | tail -80 >&2
          echo "Platform audit passed, but the xApp subscription or service-model handling failed." >&2
          exit 42
        fi
        sleep 5
      done

      kubectl logs -n {{ xapp_namespace }} deployment/"$deployment" --tail=100 >&2 || true
      echo "Platform audit passed, but no E2 indication arrived within {{ indication_timeout }} seconds." >&2
      exit 43
    executable: /bin/bash
  changed_when: false
