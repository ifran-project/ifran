# R2Lab provisioner common unprovision role.

# Input:
# - resource_name: str
# - r2lab_gateway: str
# - r2lab_slice: str

# Output: None
---
- name: Register R2Lab gateway host for '{{ resource_name }}'
  ansible.builtin.add_host:
    name: gateway
    ansible_connection: ssh
    ansible_host: "{{ r2lab_gateway }}"
    ansible_user: "{{ r2lab_slice }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

- block:
  - name: Check current R2Lab lease for '{{ resource_name }}'
    ansible.builtin.command: rhubarbe leases --check
    register: r2lab_lease_check
    failed_when: false
    changed_when: false

  - name: Set fact indicating if access is granted or denied for '{{ resource_name }}'
    ansible.builtin.set_fact:
      r2lab_access_denied: "{{ 'Access currently denied' in r2lab_lease_check.stdout or 'Access currently denied' in r2lab_lease_check.stderr }}"

  # prevent turning on device when not reserved
  - name: Fail if R2Lab access is denied for slice '{{ r2lab_slice }}' for '{{ resource_name }}'
    ansible.builtin.fail:
      msg: "Access is currently denied for slice '{{ r2lab_slice }}'. Make sure a valid reservation exists on R2Lab."
    when: r2lab_access_denied

  - name: Turn off '{{ resource_name }}' for '{{ resource_name }}'
    ansible.builtin.command: rhubarbe pdu off {{ resource_name }}

  delegate_to: gateway
