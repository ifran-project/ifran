# R2Lab UE provisioner provision role.

# Input:
# - resource_name: str
# - r2lab_gateway: str
# - r2lab_slice: str
# - attempt_reservation: bool
# - reservation_period: int (if attempt_reservation is True)
# - email: str (if attempt_reservation is True)
# - password: str (if attempt_reservation is True)

# Output:
# - ssh_info: SSHInfo
---
- name: Include common R2Lab role
  ansible.builtin.include_role:
    name: ../../../common/r2lab/provision
    public: true
