# POS provisioner unprovision role.

# Assumes the deployment machine (host on which this Ansible code will run) has
# the 'slices' and 'slices-pos' CLIs installed and authenticated with the user's SLICES account.

# Input:
# - resource_name: str
# - testbed: str

# Output: None
---
- name: Select testbed '{{ testbed }}'
  ansible.builtin.shell: slices pos testbed use {{ testbed }}

- name: Free {{ resource_name }}
  ansible.builtin.shell: slices pos allocations free {{ resource_name }} --keep-calendar-event
