# BI provisioner unprovision role.

# Assumes the deployment machine (host on which this Ansible code will run) has
# the 'slices' and 'slices-bi' CLIs installed and authenticated with the user's SLICES account.

# Input:
# - resource_name: str
# - project: str
# - infra: str
# - experiment: str

# Output: None
---
- name: Select project '{{ project }}'
  ansible.builtin.shell: slices project use {{ project }}

- name: Destroy '{{ resource_name }}' on infrastructure '{{ infra }}' using experiment '{{ experiment }}'
  ansible.builtin.shell: slices bi --infra {{ infra }} destroy {{ resource_name }} --experiment {{ experiment }}
