# Kubernetes create role

# Creates a primary Kubernetes control plane with kubeadm, deploys Flannel and optional Multus CNI,
# untaints the control plane node to allow workload scheduling, and exports the cluster join command for worker nodes.

# Input:
# - node: Node (node.name and node.roles)
# - pod_network_cidr: IPvAnyNetwork
# - service_cidr: IPvAnyNetwork
# - calico_version: str
# - install_multus: bool
# - multus_version: str
# - enable_cni_dhcp: bool
# - copy_kubeconfig_to_workers: bool
# - local_kubeconfig_path: str

# Output:
# - join_command: str
---
- name: Ensure Kubernetes directory exists on '{{ node.name }}'
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"
  changed_when: false

- name: Write kubeadm configuration on '{{ node.name }}'
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0644"

- name: Initialize the Kubernetes control plane on '{{ node.name }}'
  ansible.builtin.command: kubeadm init --config=/etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Ensure kube config directory exists for '{{ node.name }}' root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copy admin.conf to kube config on '{{ node.name }}'
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/root/.kube/config"
    remote_src: yes
    mode: "0600"

- name: Install Calico operator CRDs on '{{ node.name }}'
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      -f https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/v1_crd_projectcalico_org.yaml

- name: Install Calico operator on '{{ node.name }}'
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      -f https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/tigera-operator.yaml

- name: Write Calico installation resource on '{{ node.name }}'
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    mode: "0644"

- name: Install Calico networking on '{{ node.name }}'
  ansible.builtin.command:
    cmd: kubectl apply -f /etc/kubernetes/calico-installation.yaml

- name: Install Multus CNI on '{{ node.name }}'
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v{{ multus_version }}/deployments/multus-daemonset-thick.yml
  when: install_multus

- name: Remove default NoSchedule taint from master node '{{ node.name }}'
  ansible.builtin.command: kubectl taint nodes --all node-role.kubernetes.io/control-plane:NoSchedule-
  failed_when: false

- name: Add '{{ node.name }}' roles as Kubernetes label for later selective scheduling
  ansible.builtin.command: kubectl label nodes {{ node.name }} node-type.5g.blueprint/{{ item }}=true --overwrite
  loop: "{{ node.roles }}"

- name: Fetch admin.conf to Ansible orchestrator to be distributed to workers on '{{ node.name }}'
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ local_kubeconfig_path }}"
    flat: true

- name: Generate the Kubernetes join command from master node '{{ node.name }}' (valid for 24h)
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 24h
  register: k8s_join_command
  changed_when: false

- name: Return Kubernetes join command from '{{ node.name }}'
  ansible.builtin.set_stats:
    data:
      join_command: "{{ k8s_join_command.stdout }}"
