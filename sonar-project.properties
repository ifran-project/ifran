sonar.projectKey=ifran-project_ifran
sonar.organization=ifran-project


# # This is the name and version displayed in the SonarCloud UI.
# sonar.projectName=ifran
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Ignore coverage for all files, since we don't have any tests yet
sonar.coverage.exclusions=**/*

# Ignore false positive issues
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# Ignore Text S8565 in pyproject.toml
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e1.resourceKey=pyproject.toml

# Ignore GitHub Actions S8541 and S8544 in .github/workflows/ci.yaml
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/ci.yaml
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/ci.yaml

# Ignore Python and IPython S1313
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=**
sonar.issue.ignore.multicriteria.e5.ruleKey=ipython:S1313
sonar.issue.ignore.multicriteria.e5.resourceKey=**

# Ignore Ansible S2612
sonar.issue.ignore.multicriteria.e6.ruleKey=ansible:S2612
sonar.issue.ignore.multicriteria.e6.resourceKey=**

# Ignore YAML S2068 in docs/ and examples/ directories
sonar.issue.ignore.multicriteria.e7.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e7.resourceKey=docs/**
sonar.issue.ignore.multicriteria.e8.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e8.resourceKey=examples/**
