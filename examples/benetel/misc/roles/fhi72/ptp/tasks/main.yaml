# Build upstream linuxptp and configures ptp4l/phc2sys when this role is included
---
- name: Install linuxptp build prerequisites
  ansible.builtin.apt:
    name: [gcc, make, git]
    state: present
    update_cache: true

- name: Check out linuxptp source
  ansible.builtin.git:
    repo: https://github.com/nwtime/linuxptp.git
    dest: /usr/local/src/linuxptp
    version: "{{ miscellaneous.fhi72_params[inventory_hostname].ptp.linuxptp_version }}"
    depth: 1
    force: true
  register: fhi72_linuxptp_source
  notify: Restart PTP services

# Always run: an unchanged checkout does not mean that a previous build succeeded (make only rebuilds what changed)
- name: Build linuxptp
  ansible.builtin.command:
    argv: [make, "-j{{ ansible_facts.processor_vcpus | default(2) }}"]
    chdir: /usr/local/src/linuxptp
  changed_when: false

- name: Install linuxptp
  ansible.builtin.command:
    argv: [make, install]
    chdir: /usr/local/src/linuxptp
  changed_when: false

- name: Install ptp4l configuration
  ansible.builtin.template:
    src: ptp4l.conf.j2
    dest: /etc/ptp4l.conf
    mode: "0644"
  notify: Restart PTP services

- name: Install PTP systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop: [ptp4l, phc2sys]
  notify:
    - Reload PTP systemd
    - Restart PTP services

- name: Disable competing NTP synchronization
  ansible.builtin.command:
    argv: [timedatectl, set-ntp, "false"]
  changed_when: false

- name: Enable and start PTP services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [ptp4l, phc2sys]
