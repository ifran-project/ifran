slices:
  internet:
    sst: 1
    sd: 0xFFFFFF
    dnns:
      internet:
        ipv4Network: 12.1.1.0/24
        aggregateMaximumBitRate:
          uplink: 20Mbps
          downlink: 40Mbps
        qosFlows:
        - qfi: 1
          fiveQI: 9
          arp:
            priorityLevel: 8

  streaming:
    sst: 1
    sd: 0x100000
    dnns:
      streaming:
        ipv4Network: 14.1.1.0/24
        aggregateMaximumBitRate:
          uplink: 30Mbps
          downlink: 50Mbps
        qosFlows:
        - qfi: 1
          fiveQI: 5
          arp:
            priorityLevel: 1
