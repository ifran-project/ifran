core:
  components:
    nrf:
      type: nrf
      config:
        plmnList:
        - plmnId:
            mcc: '001'
            mnc: '01'
          snssaiList:
            - internet
            - streaming

    nssf:
      type: nssf
      config:
        nsiInfoList:
          - snssai: internet
          - snssai: streaming
        taInfoList:
        - tai:
            plmnId:
              mcc: '001'
              mnc: '01'
            tac: 1
          snssaiList:
            - internet
            - streaming
        amfInfoList:
        - amfList:
          - supportedNssaiAvailabilityData:
              tai:
                plmnId:
                  mcc: '001'
                  mnc: '01'
                tac: 1
              snssaiList:
                - internet
                - streaming
        plmnInfoList:
        - homePlmnId:
            mcc: '001'
            mnc: '01'

    ausf:
      type: ausf
      config:
        plmnList:
          - mcc: '001'
            mnc: '01'

    amf:
      type: amf
      config:
        guamiList:
          - plmnId:
              mcc: '001'
              mnc: '01'
        taiList:
        - plmnId:
            mcc: '001'
            mnc: '01'
          tac: 1
        plmnList:
        - plmnId:
            mcc: '001'
            mnc: '01'
          snssaiList:
            - internet
            - streaming

    smf:
      type: smf
      config:
        snssaiList:
          - internet
          - streaming
        plmnList:
        - mcc: '001'
          mnc: '01'
        upfs:
          - upf1
          - upf2

    upf1:
      type: upf
      config:
        snssaiList:
          - internet

    upf2:
      type: upf
      config:
        snssaiList:
          - streaming

    udr:
      type: udr

    udm:
      type: udm

    bsf:
      type: udr

    pcf:
      type: udm

ran:
  components:
    gnb:
      type: gnb
      config:
        radioConfiguration:
          nrBand: 78
        plmnList:
          - plmnId:
              mcc: '001'
              mnc: '01'
            snssaiList:
              - internet
              - streaming
        ric: flexric
        ru: n320
        amf: amf

ric:
  components:
    flexric:
      type: ric

rus:
  n320:
    type: usrp
    model: n320
    numberOfTxPorts: 1
    numberOfRxPorts: 1
    txAttenuationDB: 0
    rxAttenuationDB: 0

ues:
