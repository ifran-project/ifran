params:
  provisioning:
    experiment: 5gbp_exp
    extra_path: /Users/zimabrou/Projects/5g_blueprint/venv/bin

provisioners:
  bi:
    type: bi

  pos:
    type: pos
    params:
      attempt_reservation: true

  legacy_pos:
    type: legacy_pos
    params:
      attempt_reservation: true
      central_pos_ssh_info:
        hostname: duckburg.net.cit.tum.de
        port: 10022
        user: <your_slices_username>

  r2lab:
    type: r2lab
    params:
      attempt_reservation: true
      reservation_period: 30m
      r2lab_slice: <your_r2lab_slice>
      reservation_params:
        email: <your_r2lab_email>
        password: <your_r2lab_password>

nodes:
  sopnode-w3:
    provisioner: legacy_pos
    provisioning_params:
      boot_params: >-
        biosdevname=0 net.ifnames=0 mitigations=off intel_iommu=on iommu=pt
        selinux=0 enforcing=0 isolcpus=managed_irq,16-63
        nohz_full=16-63 nohz=on rcu_nocbs=16-63
        kthread_cpus=0-4 irqaffinity=0-4 rcu_nocb_poll
        nosoftlockup intel_pstate=disable idle=poll skew_tick=1
        tsc=nowatchdog nmi_watchdog=0 softlockup_panic=0 audit=0 nosmt
    roles:
      - ran

  sopnode-f4:
    provisioner: pos
    provisioning_params:
      boot_params: >-
        biosdevname=0 net.ifnames=0 mitigations=off intel_iommu=on iommu=pt
        selinux=0 enforcing=0 nosoftlockup intel_pstate=disable idle=poll nosmt
    roles:
      - core

  vm1:
    provisioner: bi
    roles:
      - ric

core:
  implementation: open5gs

ran:
  implementation: oai
  components:
    gnb:
      type: gnb
      advanced_config:
        pusch_TargetSNRx10: 300
        pucch_TargetSNRx10: 400

ric:
  implementation: oai

rus:
  n320:
    provisioner: r2lab

ues:
  qhat01:
    type: cots
    provisioner: r2lab

  qhat02:
    type: cots
    provisioner: r2lab
